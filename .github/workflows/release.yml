name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Linux x86-64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DIL2BRIDGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        run: |
          package="il2bridge-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${package}/bin" "dist/${package}/lib" "dist/${package}/docs"
          install -m 0755 build/bin/il2bridge "dist/${package}/bin/il2bridge"
          install -m 0755 build/lib/libil2bridge-loader.so "dist/${package}/lib/libil2bridge-loader.so"
          install -m 0644 README.md LICENSE "dist/${package}/"
          install -m 0644 docs/architecture.md "dist/${package}/docs/architecture.md"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz
          dist/*.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "Il2Bridge ${GITHUB_REF_NAME}"
