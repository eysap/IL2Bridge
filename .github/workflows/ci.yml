name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC / Debug
            cc: gcc
            cxx: g++
            build_type: Debug
            cflags: ""
            cxxflags: ""
            ldflags: ""
          - name: GCC / Release
            cc: gcc
            cxx: g++
            build_type: Release
            cflags: ""
            cxxflags: ""
            ldflags: ""
          - name: Clang / Release
            cc: clang
            cxx: clang++
            build_type: Release
            cflags: ""
            cxxflags: ""
            ldflags: ""
          - name: Clang / Debug + ASan/UBSan
            cc: clang
            cxx: clang++
            build_type: Debug
            # Generated trampolines and ABI-erased handlers intentionally do
            # not carry Clang's function-type metadata.
            cflags: -fsanitize=address,undefined -fno-sanitize=function -fno-omit-frame-pointer
            cxxflags: -fsanitize=address,undefined -fno-sanitize=function -fno-omit-frame-pointer
            ldflags: -fsanitize=address,undefined

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.ldflags }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DIL2BRIDGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
